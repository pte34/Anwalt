<section class="cta-band" aria-labelledby="cta-titel">
  <div class="container cta-inner">
    <div>
      <h2 id="cta-titel">Sprechen wir über Ihr Anliegen.</h2>
      <p>Schildern Sie mir kurz Ihre Situation – telefonisch oder über das Kontaktformular. Ich melde mich zeitnah bei Ihnen und wir besprechen das weitere Vorgehen.</p>
    </div>
    <div class="cta-actions">
      <a class="btn btn-light btn-lg" href="{{phoneHref}}">{{icon:phone}}<span>{{phoneCta}}</span></a>
      <a class="btn btn-outline-light btn-lg" href="/kontakt/#anfrage">{{icon:mail}}<span>Anfrage senden</span></a>
    </div>
  </div>
</section>
